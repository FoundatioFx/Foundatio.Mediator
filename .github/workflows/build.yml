name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  integration-coverage:
    name: Required integration suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify AWS and Redis remain in the tested solution
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET
          projects = {p.attrib['Path'] for p in ET.parse('Foundatio.Mediator.slnx').iter('Project')}
          for provider in ('Aws', 'Redis'):
              path = f'tests/Foundatio.Mediator.Distributed.{provider}.Tests/Foundatio.Mediator.Distributed.{provider}.Tests.csproj'
              assert path in projects and pathlib.Path(path).is_file(), f'Required integration suite missing: {path}'
              assert 'integration.testconfig.json' in pathlib.Path(path).read_text(), f'Skip-failure configuration missing: {path}'
              print(f'Required: {provider} integration suite, skipped tests fail CI')
  sample-web:
    name: Sample frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/CleanArchitectureSample/src/Web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: samples/CleanArchitectureSample/src/Web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  build:
    needs: integration-coverage
    uses: FoundatioFx/Foundatio/.github/workflows/build-workflow.yml@main
    secrets: inherit
    with:
      new-test-runner: true
  distributed-benchmark-smoke:
    name: Distributed benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify benchmark accounting
        run: |
          dotnet build benchmarks/Foundatio.Mediator.Distributed.Benchmarks -c Release
          dotnet benchmarks/Foundatio.Mediator.Distributed.Benchmarks/bin/Release/net10.0/Foundatio.Mediator.Distributed.Benchmarks.dll self-test
      - name: Start isolated SQS and SNS
        run: docker compose -p mediator-bench -f benchmarks/Foundatio.Mediator.Distributed.Benchmarks/compose.yaml up -d --wait
      - name: Verify all framework and transport paths
        run: dotnet benchmarks/Foundatio.Mediator.Distributed.Benchmarks/bin/Release/net10.0/Foundatio.Mediator.Distributed.Benchmarks.dll matrix --suite smoke --repetitions 1 --timeout 60 --output BenchmarkDotNet.Artifacts/distributed/smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributed-benchmark-smoke
          path: BenchmarkDotNet.Artifacts/distributed/smoke
      - name: Stop benchmark infrastructure
        if: always()
        run: docker compose -p mediator-bench -f benchmarks/Foundatio.Mediator.Distributed.Benchmarks/compose.yaml down
